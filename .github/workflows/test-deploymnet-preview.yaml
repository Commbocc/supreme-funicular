name: Check Deploy Preview URLs

on:
  status:

jobs:
  check-urls:
    # Filter to Netlify deploy-preview statuses only
    if: |
      github.event.state == 'success' &&
      contains(github.event.context, 'netlify') &&
      contains(github.event.context, 'deploy-preview')

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Check URLs and comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_URL: ${{ github.event.target_url }}
          # Configure these variables in GitHub:
          # Repository → Settings → Secrets and variables → Actions → Variables
          # https://github.com/{myorg}/{myrepo}/settings/variables/actions/new
          #
          # DEPLOY_PREVIEW_CHECKS:
          #   List of URL paths to check, with one entry per line.
          #   Optionally specify the expected HTTP status using the configured delimiter.
          #   Defaults to HTTP 200 when no status is specified.
          #
          # DEPLOY_PREVIEW_CHECKS_DELIMITER:
          #   Character separating the URL path from its expected HTTP status.
          #   Defaults to ":" if not configured.
          #
          # Example (using the default delimiter):
          #   /
          #   /welcome
          #   /api/test
          #   /404:404
          #
          CHECKS: ${{ vars.DEPLOY_PREVIEW_CHECKS }}
          CHECKS_DELIMITER: ${{ vars.DEPLOY_PREVIEW_CHECKS_DELIMITER || ':' }}
        run: |
          PR_NUMBER=$(gh api /repos/${{ github.repository }}/commits/${{ github.event.sha }}/pulls --jq '.[0].number')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No open PR found, skipping."
            exit 0
          fi

          # Validate delimiter
          if [ -z "$CHECKS_DELIMITER" ]; then
            CHECKS_DELIMITER=":"
          fi

          # Convert multiline variable into an iterable array
          mapfile -t CHECKS_ARRAY <<< "$CHECKS"

          # Remove Windows-style carriage returns
          CHECKS_ARRAY=("${CHECKS_ARRAY[@]%$'\r'}")

          FAILED=0
          BODY="**Deploy Preview URL Checks**"$'\n'

          for check in "${CHECKS_ARRAY[@]}"; do
            # Skip empty lines
            [ -z "$check" ] && continue

            # Split path and expected status using configured delimiter
            URL_PATH="${check%%"$CHECKS_DELIMITER"*}"
            EXPECTED="${check#*"$CHECKS_DELIMITER"}"

            # Default to 200 if no expected status was supplied
            [ "$EXPECTED" = "$check" ] && EXPECTED="200"

            URL="${BASE_URL}${URL_PATH}"

            ACTUAL=$(curl -o /dev/null -s -w "%{http_code}" --max-time 10 "$URL")

            if [ "$ACTUAL" = "$EXPECTED" ]; then
              BODY+="✅ \`[${URL_PATH}](${URL})\` → ${ACTUAL}"$'\n'
            else
              BODY+="❌ \`[${URL_PATH}](${URL})\` → ${ACTUAL} (expected ${EXPECTED})"$'\n'
              FAILED=1
            fi
          done

          echo "$BODY"

          gh pr comment "$PR_NUMBER" --repo ${{ github.repository }} --body "$BODY"

          exit $FAILED
