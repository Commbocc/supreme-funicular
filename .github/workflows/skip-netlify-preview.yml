name: Skip Netlify Preview for Main PRs

on:
  pull_request:
    types: [opened, edited, reopened]
    branches:
      - stage

permissions:
  pull-requests: write

jobs:
  skip-netlify-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Add Netlify skip marker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" != *"[skip netlify]"* ]]; then
            gh pr edit "$PR_NUMBER" \
              --title "$PR_TITLE [skip netlify]"
          fi
